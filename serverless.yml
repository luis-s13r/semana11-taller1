
org: luissanchezr
service: api-s3-taller11

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: dev
  memorySize: 1024
  timeout: 30
  iam:
    role: arn:aws:iam::715081672185:role/LabRole

functions:
  crear_bucket:
    handler: handler.crear_bucket
    events:
      - http:
          path: s3/crear-bucket
          method: post
          cors: true

  crear_directorio:
    handler: handler.crear_directorio
    events:
      - http:
          path: s3/crear-directorio
          method: post
          cors: true

  subir_archivo:
    handler: handler.subir_archivo
    events:
      - http:
          path: s3/subir-archivo
          method: post
          cors: true
